<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipe Sizing Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mut:#6b7280;--bd:#e2e5ea;--ac:#2563eb;--ok:#16a34a;--lo:#0284c7;--hi:#dc2626;--grid:#d9dde3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1b1e24;--tx:#e8eaed;--mut:#9aa1ac;--bd:#2c3038;--ac:#60a5fa;--ok:#4ade80;--lo:#38bdf8;--hi:#f87171;--grid:#2c3038;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111317;--card:#1b1e24;--tx:#e8eaed;--mut:#9aa1ac;--bd:#2c3038;--ac:#60a5fa;--ok:#4ade80;--lo:#38bdf8;--hi:#f87171;--grid:#2c3038;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Thai",Sarabun,sans-serif;padding:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;max-width:1100px;margin:0 auto 14px}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--mut);margin:0;font-size:12px}
.lang{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:var(--card);color:var(--mut);padding:6px 12px;font:inherit;cursor:pointer}
.lang button.on{background:var(--ac);color:#fff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.card h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:8px}
input,select{width:100%;margin-top:3px;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{border:1px solid var(--bd);border-radius:8px;padding:10px}.k b{display:block;font-size:22px}.k span{font-size:11px;color:var(--mut)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.k .badge{font-size:12px;color:#fff}
.top-r{display:flex;gap:8px;flex:none;align-items:flex-start;flex-wrap:wrap}
@media(max-width:560px){
 .top{flex-direction:column;align-items:stretch;gap:8px}
 .top-r{justify-content:flex-start}
 h1{font-size:16px}
}
.gear{border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);padding:6px 12px;font:inherit;cursor:pointer}
.gear:hover{border-color:var(--ac)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:16px;width:calc(100% - 32px);max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dh h2{margin:0}
.x{border:0;background:transparent;color:var(--mut);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.done{width:100%;margin-top:6px;padding:9px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.ok{background:var(--ok)}.lo{background:var(--lo)}.hi{background:var(--hi)}
.lov{width:calc(100% - 32px);max-width:320px;padding:0}
.lob{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px;width:calc(100% - 32px);max-width:320px}
.lob h2{margin:0 0 14px;font-size:16px}
.lob label{margin-bottom:10px}
.lob .err{color:var(--hi);font-size:12px;min-height:16px;margin-bottom:6px}
.lob button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.hide{display:none!important}
.admin{background:var(--card);border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:6px 12px;font:inherit;cursor:pointer}
.admin:hover{border-color:var(--ac)}
input:disabled,select:disabled{opacity:.5;cursor:not-allowed}
.loginbar{font-size:12px;color:var(--mut);margin-top:4px}
#adlg{max-width:640px}
#adlg textarea{width:100%;min-height:120px;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:12px/1.4 monospace;margin-top:6px}
#adlg table{font-size:12px}
.wide{grid-column:1/-1}.sc{overflow-x:auto}.fl{stroke:#38bdf8;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:7 9;fill:none;animation:flw .7s linear infinite}@keyframes flw{to{stroke-dashoffset:-16}}.sp{fill:none;stroke:#38bdf8;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:spr 1.1s ease-out infinite}@keyframes spr{0%{transform:scale(.4);opacity:.95}100%{transform:scale(2.4);opacity:0}}@media (prefers-reduced-motion:reduce){.fl,.sp{animation:none}}.sc.mh{max-height:360px;overflow-y:auto}#lsT{min-width:900px}#lsT tbody tr{cursor:pointer}#lsT tr.on td{background:rgba(245,158,11,.2)}#lsT td.mu{color:var(--mut)}#lsT .lk{padding:3px 10px;white-space:nowrap}#lsT .lk:disabled{opacity:.45;pointer-events:none}#lsT th{position:sticky;top:0;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:480px}th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}tr.sel{background:color-mix(in srgb,var(--ac) 14%,transparent)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.foot{max-width:1100px;margin:14px auto 0;padding-top:10px;border-top:1px solid var(--bd);text-align:center;font-size:12px;color:var(--mut)}
svg text{fill:var(--mut);font-size:10px}
.tabs{display:flex;gap:6px;max-width:1100px;margin:0 auto 14px;border-bottom:1px solid var(--bd)}
.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--mut);padding:8px 18px;font:inherit;font-weight:600;cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k small{display:block;font-size:11px;color:var(--mut)}
.lk{display:inline-block;text-decoration:none;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);padding:7px 12px;font:inherit;cursor:pointer}
.lk:hover{border-color:var(--ac)}.lk.off{pointer-events:none;opacity:.45}
.mapw{margin-top:10px}.mapw .lks{margin:0 0 8px}.lk.on{border-color:var(--ac);color:var(--ac)}.mapf{width:100%;height:320px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);display:block}.mapf.hide{display:none}
.lks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
input[readonly]{opacity:.7}
.useb{width:100%;margin-top:12px;padding:9px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.grp{border:1px solid var(--bd);border-radius:8px;padding:10px 10px 2px;margin-bottom:10px}.grp:last-child{margin-bottom:0}.grp>h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ac)}
#pzT{min-width:420px}#pzT td.mx{background:rgba(245,158,11,.28);font-weight:700}
</style>
</head>
<body>
<dialog id="lov" class="lov">
  <div class="lob">
    <div class="dh"><h2 data-t="loginTitle"></h2><button class="x" id="loX" type="button" aria-label="Close">&times;</button></div>
    <div class="err" id="loErr"></div>
    <label><span data-t="loginUser"></span><input id="loU" type="text" autocomplete="username"></label>
    <label><span data-t="loginPass"></span><input id="loP" type="password" autocomplete="current-password"></label>
    <button id="loBtn" type="button" data-t="loginBtn"></button>
  </div>
</dialog>
<dialog id="adlg">
  <div class="dh"><h2 data-t="adminTitle"></h2><button class="x" id="adX" type="button" aria-label="Close">&times;</button></div>
  <h3 style="font-size:12px;text-transform:uppercase;color:var(--mut);margin:0 0 6px" data-t="adminAdd"></h3>
  <textarea id="adBulk" placeholder="username1,password1&#10;username2,password2"></textarea>
  <button class="done" id="adAddBtn" type="button" data-t="adminAddBtn"></button>
  <div class="note" id="adAddMsg"></div>
  <h3 style="font-size:12px;text-transform:uppercase;color:var(--mut);margin:16px 0 6px" data-t="adminLog"></h3>
  <div class="sc"><table id="adTb"></table></div>
  <button class="done" id="adClose" type="button" data-t="close"></button>
</dialog>
<dialog id="rpt" style="max-width:900px">
  <div class="dh"><h2 data-t="rptT"></h2><button class="x" id="rpX" type="button" aria-label="Close">&times;</button></div>
  <div id="rptB" class="rp" style="max-height:68vh;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:14px"></div>
  <div class="lks" style="margin-top:10px"><button class="lk" id="rpPrn" type="button" data-t="rptPrn"></button><button class="lk" id="rpDl" type="button" data-t="rptDl"></button><button class="lk" id="rpC" type="button" data-t="close"></button></div>
</dialog>
<div id="rptP" class="rp"></div>
<div class="top">
  <div><h1><span data-t="title"></span> <small style="font-size:12px;font-weight:600;color:var(--mut)">ST</small> <small style="font-size:12px;font-weight:600;color:var(--mut)">Rev.21.1</small></h1><p class="sub" data-t="sub"></p></div>
  <div class="top-r"><button class="admin" id="bLogin" type="button">🔒 <span data-t="loginBtn"></span></button><button class="admin hide" id="bLogout" type="button">🔓 <span data-t="logoutBtn"></span></button><button class="admin hide" id="bAdmin" type="button">👤 <span data-t="adminBtn"></span></button><button class="gear" id="bSet" type="button">⚙ <span data-t="set"></span></button><div class="lang"><button id="bEn">EN</button><button id="bTh">ไทย</button></div></div>
</div>
<div class="tabs"><button id="tD" type="button" class="on" data-t="tabD"></button><button id="tC" type="button" data-t="tabC"></button></div>

<!-- ===== DESIGN FIELD ===== -->
<div class="grid" id="pgDesign">
  <div class="card wide">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <label style="margin:0;flex:1 1 220px"><span data-t="prjL"></span><input id="prj" type="text" maxlength="80" autocomplete="off"></label>
      <div class="lks" style="margin:0"><button class="lk" id="bSave" type="button">💾 <span data-t="bSave"></span></button><button class="lk" id="bLoad" type="button">📂 <span data-t="bLoad"></span></button><button class="lk" id="bRpt" type="button">📄 <span data-t="bRpt"></span></button></div>
    </div>
    <input id="fLoad" type="file" accept=".json,application/json" class="hide">
    <div class="note" id="prjMsg"></div>
  </div>
  <div class="card">
    <h2 data-t="dsh"></h2>
    <div class="grp"><h3 data-t="grp1"></h3>
      <div class="row">
        <label><span data-t="nr"></span><input id="nr" type="number" step="1" min="1" value="8"></label>
        <label><span data-t="ntr"></span><input id="nt" type="number" step="1" min="1" value="10"></label>
      </div>
      <div class="row">
        <label><span data-t="rdist"></span><input id="rd" type="number" step="any" min="0" value="8"></label>
        <label><span data-t="tdist"></span><input id="td" type="number" step="any" min="0" value="8"></label>
      </div>
      <div class="row">
        <label><span data-t="zrL"></span><input id="zr" type="number" step="1" min="1"></label>
        <label><span data-t="znL"></span><select id="zn"></select></label>
      </div>
      <div class="row">
        <label><span data-t="pmxL"></span><select id="pmx"><option value="s" data-t="pmxA"></option><option value="m" data-t="pmxB"></option></select></label>
        <label><span data-t="pmyL"></span><select id="pmy"><option value="s" data-t="pmyA"></option><option value="m" data-t="pmyB"></option></select></label>
      </div>
    </div>
    <div class="grp"><h3 data-t="grp2"></h3>
      <label><span data-t="nsp"></span><input id="ns" type="number" step="1" min="1" value="1"></label>
      <div class="row">
        <label><span data-t="fq"></span><input id="fq" type="number" step="any" min="0" value="120"></label>
        <label><span data-t="unit"></span><select id="dfu"></select></label>
      </div>
      <label><span data-t="spL"></span><input id="sp" type="number" step="any" min="0" placeholder="bar"></label>
    </div>
    <div class="grp"><h3 data-t="grp3"></h3>
      <label><span data-t="pmL"></span><input id="pm" type="number" step="any" min="0"></label>
      <label><span data-t="fdL"></span><input id="fd" type="number" step="any" min="0"></label>
    </div>
    <div class="grp"><h3 data-t="grp4"></h3>
      <label><span data-t="fitL"></span><input id="fit" type="number" step="any" min="0" value="20" placeholder="20"></label>
      <label style="margin-bottom:4px;color:var(--tx);font-weight:600"><span data-t="elevL"></span></label>
      <div class="row">
        <label><span data-t="ez0s"></span><input id="ez0" type="number" step="any" placeholder="m"></label>
        <label><span data-t="ez1s"></span><input id="ez1" type="number" step="any" placeholder="m"></label>
      </div>
      <label><span data-t="ez2s"></span><input id="ez2" type="number" step="any" placeholder="m"></label>
    </div>
  </div>
  <div class="card">
    <h2 data-t="dsum"></h2>
    <div class="kpi3">
      <div class="k"><span data-t="kTrees"></span><b id="dkT">-</b></div>
      <div class="k"><span data-t="kSpr"></span><b id="dkS">-</b></div>
      <div class="k"><span data-t="kQ"></span><b id="dkQ">-</b><span>m³/h</span><small id="dkQ2"></small></div>
      <div class="k"><span data-t="kL"></span><b id="dkL">-</b><span>m</span></div>
      <div class="k"><span data-t="kDz"></span><b id="dkZ">-</b><span>m</span></div>
      <div class="k"><span data-t="kArea"></span><b id="dkA">-</b><span>m²</span></div>
    </div>
    <button class="useb" id="bUse" type="button" data-t="useBtn"></button>
    <div class="note" data-t="dnote"></div>
  </div>
  <div class="card">
    <h2 data-t="loc"></h2>
    <label><span data-t="cPump"></span><input id="cp" type="text" inputmode="decimal" placeholder="13.7563, 100.5018" autocomplete="off"></label>
    <label><span data-t="cLast"></span><input id="cl" type="text" inputmode="decimal" placeholder="13.7570, 100.5025" autocomplete="off"></label>
    <div class="note" id="cDist" style="margin:-2px 0 8px"></div>
    <div class="lks">
      <a class="lk off" id="lkE" target="_blank" rel="noopener noreferrer">🌍 <span data-t="lkE"></span></a>
      <a class="lk off" id="lkM" target="_blank" rel="noopener noreferrer">📍 <span data-t="lkM"></span></a>
      <button class="lk" id="bKml" type="button">⬇ <span data-t="kml"></span></button>
    </div>
    <div class="mapw">
      <div class="lks"><button class="lk on" id="mM" type="button" data-t="mapM"></button><button class="lk" id="mS" type="button" data-t="mapS"></button></div>
      <iframe class="mapf hide" id="mapF" title="Map" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      <div class="note" id="mapH" data-t="mapH"></div>
    </div>
    <div class="note" data-t="cNote"></div>
  </div>
  <div class="card wide">
    <h2 data-t="lsum"></h2>
    <div class="note" id="plN" style="margin:0 0 8px;font-weight:700"></div>
    <div class="sc mh"><table id="lsT"></table></div>
    <button class="useb" id="bAuto" type="button" style="width:auto;padding:9px 18px" data-t="autoBtn"></button>
    <div class="note" id="autoMsg"></div>
    <div class="note" data-t="lsNote"></div>
  </div>
  <div class="card wide">
    <h2 data-t="drh"></h2>
    <div class="sc"><svg id="dsg" viewBox="0 0 800 460" width="100%" style="min-width:560px"></svg></div>
    <h2 style="margin-top:14px" data-t="prof"></h2>
    <div class="sc"><svg id="dpf" viewBox="0 0 800 150" width="100%" style="min-width:560px"></svg></div>
  </div>
  <div class="card wide">
    <h2 data-t="pumpH"></h2>
    <div class="note" style="margin:0 0 6px;font-weight:700" data-t="pzH"></div>
    <div class="sc"><table id="pzT"></table></div>
    <div class="note" id="pzN" style="margin:6px 0 14px"></div>
    <div class="sc"><table id="pmT"></table></div>
    <div class="note" id="pmN" style="margin-top:6px"></div>
  </div>
</div>

<!-- ===== CALCULATION FIELD (all pipe sizing) ===== -->
<div class="grid hide" id="pgCalc">
  <div class="card">
    <h2 data-t="in"></h2>
    <div class="row">
      <label><span data-t="flow"></span><input id="q" type="number" step="any" value="9.6"></label>
      <label><span data-t="unit"></span><select id="u"></select></label>
    </div>
    <label><span data-t="ptype"></span><select id="pt"></select></label>
    <label><span data-t="size"></span><select id="d"></select></label>
  </div>
  <div class="card">
    <h2 data-t="res"></h2>
    <div class="kpi">
      <div class="k"><span data-t="v"></span><b id="rv">-</b><span data-t="ms"></span></div>
      <div class="k"><span data-t="hl"></span><b id="rh">-</b><span data-t="hlu"></span></div>
      <div class="k"><span data-t="tot"></span><b id="rt">-</b><span data-t="totu"></span></div>
      <div class="k"><span data-t="status"></span><b id="rs">-</b><span id="rn"></span></div>
    </div>
    <div class="note" id="rec"></div>
    <label style="margin-top:10px"><span data-t="tgtL"></span><select id="tgt"></select></label>
    <button class="useb" id="bBack" type="button" data-t="backBtn"></button>
    <div class="note" id="backMsg"></div>
  </div>
  <div class="card">
    <h2 data-t="sech"></h2>
    <svg id="sec" viewBox="0 0 360 250" width="100%" style="max-height:300px"></svg>
    <div class="note" id="secn"></div>
  </div>
  <div class="card wide">
    <h2 data-t="ch"></h2>
    <div class="sc"><svg id="ch" viewBox="0 0 800 460" width="100%" style="min-width:640px"></svg></div>
    <div class="note" data-t="cn"></div>
  </div>
  <div class="card wide">
    <h2><span data-t="all"></span> <span id="tbl" style="text-transform:none;letter-spacing:0;font-weight:700;color:var(--ac);margin-left:8px"></span></h2>
    <div class="sc"><table id="tb"></table></div>
    <div class="note" style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><span id="gd"></span><span style="white-space:nowrap"><span id="vis" style="display:none"><span data-t="vis"></span>: <b id="vn">-</b></span></span></div>
  </div>
  <div class="card wide hide" id="calcCard">
    <h2 data-t="calch"></h2>
    <div id="cb" class="sc"></div>
  </div>
</div>

<dialog id="dlg">
  <div class="dh"><h2 data-t="set"></h2><button class="x" id="bX" type="button" aria-label="Close">&times;</button></div>
  <label><span data-t="c"></span><input id="c" type="number" step="any" value="150"></label>
  <label><span data-t="len"></span><input id="l" type="number" step="any" value="1"></label>
  <div class="row">
    <label><span data-t="vmin"></span><input id="vl" type="number" step="any" min="0" value="1"></label>
    <label><span data-t="vmax"></span><input id="vm" type="number" step="any" value="1.5"></label>
  </div>
  <div class="note" data-t="cnote"></div>
  <button class="done" id="bOk" type="button" data-t="close"></button>

function dlFile(name,mime,txt){const u=URL.createObjectURL(new Blob([txt],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const fname=ext=>(($('prj').value||'').trim().replace(/[^\w\u0E00-\u0E7F.-]+/g,'_').slice(0,60)||'pipe-design')+'_'+new Date().toISOString().slice(0,10)+ext;
const RES_KEY=/^(pump|lat|feed|sec\d+)$/;
const packRes=R=>{const o={};Object.keys(R).forEach(k=>{if(RES_KEY.test(k)){const e=R[k];o[k]={pt:e.pt,ds:e.ds,v:e.v,hf:e.hf,tot:e.tot,cls:e.cls,qh:e.qh,Ln:e.Ln}}});return o};

  dlFile(fname('.json'),'application/json',JSON.stringify({app:'pipe-sizing',rev:18,saved:new Date().toISOString(),inputs,results,zres},null,1))};
$('bLoad').onclick=()=>$('fLoad').click();
$('fLoad').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const msg=$('prjMsg');
 if(f.size>2e6){msg.textContent=t('loadBad');return}
 const rd=new FileReader();rd.onerror=()=>{msg.textContent=t('loadBad')};
 rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||o.app!=='pipe-sizing'||!o.inputs||typeof o.inputs!=='object')throw 0;
  SAVE_IN.forEach(i=>{const v=o.inputs[i];if(typeof v!=='string'&&typeof v!=='number')return;const el=$(i),sv=String(v);
   if(el.tagName==='SELECT'){if([...el.options].some(x=>x.value===sv))el.value=sv}else el.value=sv.slice(0,120)});
  Object.keys(RES).forEach(k=>delete RES[k]);Object.keys(ZR).forEach(k=>delete ZR[k]);CURZ=-1;
  const num=x=>typeof x==='number'&&isFinite(x)?x:null;
  const parseRes=src=>{const out={};if(src&&typeof src==='object')Object.keys(src).forEach(k=>{if(!RES_KEY.test(k))return;const e=src[k];if(!e||typeof e!=='object')return;
   const r={ds:num(e.ds),v:num(e.v),hf:num(e.hf),tot:num(e.tot),qh:num(e.qh),Ln:num(e.Ln),pt:String(e.pt),cls:['lo','ok','hi'].includes(e.cls)?e.cls:'ok'};
   if(['ds','v','hf','tot','qh','Ln'].every(z=>r[z]!==null)&&(r.pt==='n'||PTN[r.pt]))out[k]=r});return out};
  if(o.zres&&typeof o.zres==='object')Object.keys(o.zres).forEach(z=>{if(/^\d{1,3}$/.test(z))ZR[+z]=parseRes(o.zres[z])});
  ZR[Math.max(0,(parseInt(o.inputs.zn,10)||1)-1)]=parseRes(o.results);
  SEL=null;drawDesign();const zn=String(o.inputs.zn||'');if([...$('zn').options].some(x=>x.value===zn))$('zn').value=zn;
  drawDesign();updateLoc();run();msg.textContent=t('loadOk')+f.name}catch(err){msg.textContent=t('loadBad')}};
 rd.readAsText(f)};

  prj=g('prj').trim();
 return `<h1>${esc(t('title'))}</h1><div class="meta">${prj?'<b>'+esc(prj)+'</b> · ':''}${esc(t('rptDt'))}: ${new Date().toLocaleDateString(L=='th'?'th-TH':'en-GB')} · Rev.18</div>

<div class="pg"><table>${kv(t('lnTot'),pn(TOTLEN)+' m')}</table><h3>${t('pumpH')}</h3><table>${$('pzT').innerHTML}</table><div class="note">${esc($('pzN').textContent)}</div></div>
<div class="pg"><h3>${t('prof')}</h3>${prof}</div>
<div class="note">${t('rpNote')} C = ${esc(g('c'))}</div>`}

async function doLogin(){
 $('loErr').textContent='';const u=$('loU').value.trim(),p=$('loP').value;
 if(!u||!p)return;
 let r;try{r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})}catch(e){$('loErr').textContent=t('loginErrServer');return}
 if(!r.ok){$('loErr').textContent=t('loginErr');return}
 const d=await r.json();TOKEN=d.token;ADMIN=!!d.admin;
 try{localStorage.setItem('tok',TOKEN);localStorage.setItem('adm',ADMIN?'1':'0')}catch(e){}
 $('loP').value='';hideLogin();build();run()}
